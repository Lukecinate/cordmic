name: ci

on:
  pull_request:
  push:
    branches: ["**"]
    tags-ignore: ["**"]

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require 40-character action SHAs
        run: bash tools/release/check-action-pins.sh

  test-dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.0.x"
      - name: Test CordMic.Core
        run: dotnet test windows-app/tests/CordMic.Tests/CordMic.Tests.csproj -c Release --nologo

  test-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Android unit tests
        working-directory: android
        run: ./gradlew testReleaseUnitTest --no-daemon
